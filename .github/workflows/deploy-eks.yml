name: Deploy backend to Amazon EKS

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: backend-despachos-devops

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Deploy to EKS
        run: |
          sed -i "s/ACCOUNT_ID/$AWS_ACCOUNT_ID/g; s/AWS_REGION/$AWS_REGION/g" k8s/backend-despachos-deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout restart deployment/backend-despachos -n devops
          kubectl rollout status deployment/backend-despachos -n devops --timeout=300s
